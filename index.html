<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>قص الفيديو</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090a0f;
  --panel:#131620;
  --panel2:#1b1f2e;
  --line:rgba(255,255,255,.12);
  --txt:#f8fafc;
  --muted:#94a3b8;
  --acc:#e2e8f0;
  --acc-txt:#090a0f;
  --t:env(safe-area-inset-top,0px);
  --r:env(safe-area-inset-right,0px);
  --b:env(safe-area-inset-bottom,0px);
  --l:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  height:100%;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--txt);
  font-family:'Tajawal',system-ui,sans-serif;
}
button,input{font-family:inherit;color:inherit}
button{border:0;padding:0;background:none;cursor:pointer}
.hidden{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* الحاوية الرئيسية للمشغل */
#playerContainer{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#050609;
}
#mainVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#050609;
}

/* شاشة البداية البسيطة */
#emptyState{
  position:absolute;
  z-index:20;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(90vw,420px);
  padding:32px 24px;
  border-radius:28px;
  background:var(--panel);
  border:1px solid var(--line);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.has-video #emptyState{opacity:0;visibility:hidden;pointer-events:none}
#emptyState .ic{width:54px;height:54px;color:var(--txt)}
#emptyState b{font-size:22px;font-weight:800}
#emptyState span{font-size:15px;color:var(--muted);line-height:1.6}

/* طبقة الواجهة */
#ui{
  position:absolute;
  inset:0;
  z-index:40;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  pointer-events:none;
  padding:calc(var(--t) + 12px) calc(var(--r) + 12px) calc(var(--b) + 12px) calc(var(--l) + 12px);
}
#ui > *{pointer-events:auto}

/* الشريط العلوي */
.topbar{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:8px;
  background:rgba(19,22,32,.92);
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px 10px;
  width:100%;
  max-width:960px;
  margin:0 auto;
}
.url-input{
  width:100%;
  min-width:0;
  height:44px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 12px;
  font-size:15px;
  outline:none;
}
.url-input::placeholder{color:var(--muted)}
.btn-sec{
  height:44px;
  padding:0 14px;
  border-radius:12px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:14px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  max-width:100%;
}
.btn-sec:active{transform:scale(.97)}
.btn-pri{
  height:44px;
  padding:0 16px;
  border-radius:12px;
  background:var(--acc);
  color:var(--acc-txt);
  font-size:15px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  max-width:100%;
}
.btn-pri:active{transform:scale(.97)}

/* شريط التحديد والقص السفلي */
.bottom{
  width:100%;
  max-width:960px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* شريط تحديد A-B وقص وحفظ */
.abbar{
  display:none;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  padding:10px 12px;
  border-radius:20px;
  background:rgba(19,22,32,.96);
  border:1px solid var(--line);
  width:100%;
}
.abbar.open{display:flex}
.ab-btn{
  flex:1 1 auto;
  min-width:110px;
  height:44px;
  padding:0 14px;
  border-radius:13px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:14px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.ab-btn b{
  font-family:monospace;
  font-size:14px;
  direction:ltr;
  color:#e2e8f0;
}
.cut-btn{
  flex:1 1 auto;
  min-width:120px;
  height:44px;
  padding:0 16px;
  border-radius:13px;
  background:#ffffff;
  color:#090a0f;
  font-size:15px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.cut-btn:active{transform:scale(.97)}
.x-btn{
  width:44px;
  height:44px;
  flex:none;
  border-radius:13px;
  background:var(--panel2);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
}
.cmsg{
  flex:1 1 100%;
  min-height:42px;
  padding:8px 14px;
  border-radius:13px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* قائمة اللقطات العشوائية الخمس */
.rand-list{
  width:100%;
  max-height:34dvh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:4px;
}
.rand-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--line);
  flex-wrap:wrap;
}
.rand-info{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.rand-info b{font-size:15px;font-weight:800}
.rand-info span{font-size:12.5px;color:var(--muted);direction:ltr;text-align:right}
.rand-acts{
  display:flex;
  align-items:center;
  gap:6px;
  margin-right:auto;
}
.rand-acts button{
  height:38px;
  padding:0 12px;
  border-radius:11px;
  font-size:13px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.rand-acts .r-dl{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
.rand-acts .r-sh{background:#ffffff;color:#090a0f}

/* لوحة التحكم السفلية */
.dock{
  background:rgba(19,22,32,.94);
  border:1px solid var(--line);
  border-radius:22px;
  padding:10px 14px 12px;
  width:100%;
}
.times{
  display:flex;
  justify-content:space-between;
  direction:ltr;
  font-size:14px;
  font-weight:700;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  margin-bottom:2px;
}
.seek-container{
  position:relative;
  height:36px;
  display:flex;
  align-items:center;
  direction:ltr;
  cursor:pointer;
  touch-action:none;
}
.seek-bar{
  position:relative;
  width:100%;
  height:7px;
  border-radius:99px;
  background:rgba(255,255,255,.16);
}
#progFill{
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:100%;
  border-radius:99px;
  background:#ffffff;
}
#progFill::after{
  content:"";
  position:absolute;
  right:-10px;
  top:50%;
  width:20px;
  height:20px;
  margin-top:-10px;
  border-radius:50%;
  background:#ffffff;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
}
#abSeg{
  position:absolute;
  top:-4px;
  height:15px;
  border-radius:6px;
  background:rgba(255,255,255,.28);
  border-left:3px solid #ffffff;
  border-right:3px solid #ffffff;
  display:none;
  pointer-events:none;
}

.ctrl-row{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:6px;
}
.grp-play{
  direction:ltr;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.grp-actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  width:100%;
}
.grp-actions .btn-sec,
.grp-actions .btn-pri{
  width:100%;
  padding:0 6px;
  font-size:13.5px;
  height:42px;
}
.grp-actions .ic{width:17px;height:17px}
.ctrl-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
}
.ctrl-btn:active{transform:scale(.95)}
.play-main{
  width:52px;
  height:52px;
  border-radius:16px;
  background:#ffffff;
  color:#090a0f;
  display:grid;
  place-items:center;
}
.play-main .ic{width:24px;height:24px}

@media (min-width:720px){
  .ctrl-row{
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
  }
  .grp-actions{
    width:auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .grp-actions .btn-sec,
  .grp-actions .btn-pri{
    width:auto;
    padding:0 14px;
    font-size:14.5px;
    height:46px;
  }
}
@media (max-width:380px){
  .topbar{padding:6px 8px;gap:6px}
  .btn-sec,.btn-pri,.url-input{height:40px;font-size:13px;padding:0 10px}
  .grp-actions{grid-template-columns:repeat(2,1fr)}
}
.url-input{
  flex:1;
  min-width:160px;
  height:46px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 14px;
  font-size:16px;
  outline:none;
}
.url-input::placeholder{color:var(--muted)}
.btn-sec{
  height:46px;
  padding:0 16px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:15px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
}
.btn-sec:active{transform:scale(.97)}
.btn-pri{
  height:46px;
  padding:0 20px;
  border-radius:14px;
  background:var(--acc);
  color:var(--acc-txt);
  font-size:16px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
}
.btn-pri:active{transform:scale(.97)}

}
.play-main .ic{width:26px;height:26px}

/* إشعار التنبيه */
#toastNotification{
  position:fixed;
  top:calc(var(--t) + 78px);
  left:50%;
  transform:translateX(-50%);
  z-index:200;
  max-width:92vw;
  padding:12px 20px;
  border-radius:16px;
  background:var(--panel);
  border:1px solid var(--line);
  font-size:15px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s;
}

/* طبقة التوهج والأنيميشن مع Canvas أثناء القص */
#cutStage{
  position:fixed;
  inset:0;
  z-index:300;
  background:#050609;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .25s ease,visibility .25s ease;
}
#cutStage.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.cut-glow-1{
  position:absolute;
  width:min(85vw,560px);
  height:min(85vw,560px);
  border-radius:50%;
  background:radial-gradient(circle,var(--gc1,rgba(226,232,240,.32)) 0%,rgba(5,6,9,0) 70%);
  filter:blur(48px);
  animation:glowPulse 2.4s ease-in-out infinite alternate;
  pointer-events:none;
}
.cut-glow-2{
  position:absolute;
  width:min(70vw,420px);
  height:min(70vw,420px);
  border-radius:50%;
  background:radial-gradient(circle,var(--gc2,rgba(148,163,184,.24)) 0%,rgba(5,6,9,0) 72%);
  filter:blur(36px);
  animation:glowDrift 3.2s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes glowPulse{
  0%{transform:scale(.92);opacity:.75}
  100%{transform:scale(1.12);opacity:1}
}
@keyframes glowDrift{
  0%{transform:translate(-18px,10px) scale(.95)}
  100%{transform:translate(18px,-12px) scale(1.08)}
}
#cutGlowBox{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  width:min(90vw,560px);
  max-height:54dvh;
  animation:glowFloat 3.6s ease-in-out infinite;
}
@keyframes glowFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
#cutPreviewCanvas{
  display:block;
  max-width:100%;
  max-height:54dvh;
  width:auto;
  height:auto;
  border-radius:22px;
  background:#090a0f;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 20px 55px rgba(0,0,0,.85);
}
#cutGlowCaption{
  position:relative;
  z-index:3;
  margin-top:18px;
  padding:12px 24px;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--line);
  font-size:17px;
  font-weight:800;
}
</style>

  <video id="mainVideo" playsinline webkit-playsinline preload="auto"></video>

    <label class="btn-pri" style="margin-top:6px">
      <input type="file" id="emptyFileInput" accept="video/*" style="display:none" onchange="loadLocalVideo(this)">
      <svg class="ic"><use href="#i-up"/></svg>
      <span>اختيار فيديو</span>
    </label>
  </div>

  <div id="ui">

      <label class="btn-sec" title="اختيار فيديو من الجهاز">
        <input type="file" id="localVideoFile" accept="video/*" style="display:none" onchange="loadLocalVideo(this)">
        <svg class="ic"><use href="#i-up"/></svg>
        <span>ملف</span>
      </label>
      <input type="text" id="videoUrl" class="url-input" placeholder="الصق رابط الفيديو..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button class="btn-pri" onclick="updateSource()">تشغيل</button>
    </div>

    <div class="bottom">
      <div class="abbar" id="abBar">
        <button class="ab-btn" onclick="abSet('a')">البداية <b id="abAt">--:--</b></button>

        <button class="cut-btn" onclick="clipStart()">
          <svg class="ic"><use href="#i-cut"/></svg>
          <span>قص وحفظ</span>
        </button>
        <button class="x-btn" onclick="abClear()" title="مسح التحديد">
          <svg class="ic"><use href="#i-x"/></svg>
        </button>

      <div class="abbar" id="clipBar">
        <span id="clipMsg" class="cmsg"></span>
        <div id="randomList" class="rand-list hidden"></div>
        <button id="clipSave" class="cut-btn hidden" onclick="clipShare()">

        </button>

        </button>

      <div class="dock">

        </div>

          <div class="seek-bar">
            <div id="progFill"></div>
            <div id="abSeg"></div>
          </div>

<!-- شاشة التوهج والأنيميشن مع Canvas أثناء القص -->
<div id="cutStage" aria-hidden="true">
  <div id="cutGlowLayer1" class="cut-glow-1"></div>
  <div id="cutGlowLayer2" class="cut-glow-2"></div>
  <div id="cutGlowBox">
    <canvas id="cutPreviewCanvas"></canvas>
  </div>
  <div id="cutGlowCaption">جارٍ القص…</div>
</div>

<div id="toastNotification"></div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ico = (el, n) => { const u = el.querySelector('use'); if (u) u.setAttribute('href', '#i-' + n); };

const video = $('mainVideo');
const box = $('playerContainer');
const progFill = $('progFill');
const seekWrapper = $('seekWrapper');
const urlInput = $('videoUrl');
const toast = $('toastNotification');

let localFile = null;
let currentObjectURL = null;
let dragging = false;
let dragPos = 0;
let toastTimer = null;
let triedNoCors = false;

function showNotification(m) {
  toast.textContent = m;
  toast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = 0; }, 3500);
}

const formatTime = s => {
  if (!isFinite(s) || s < 0) return '00:00';
  const m = Math.floor(s / 60);
  const c = Math.floor(s % 60);
  return (m < 10 ? '0' + m : m) + ':' + (c < 10 ? '0' + c : c);
};

function togglePlay() {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
}
function skip(v) {
  if (!video.duration) return;
  video.currentTime = clamp(video.currentTime + v, 0, video.duration);
}

function loadLocalVideo(inp) {
  if (!inp.files || !inp.files[0]) return;
  const f = inp.files[0];
  localFile = f;
  if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
  currentObjectURL = URL.createObjectURL(f);
  video.removeAttribute('crossorigin');
  video.src = currentObjectURL;
  video.preload = 'auto';
  video.load();
  urlInput.value = 'ملف محلي: ' + f.name;
  video.play().then(() => showNotification('تم تحميل الفيديو')).catch(() => {});
}

function updateSource() {
  const u = urlInput.value.trim();
  if (!u || u.startsWith('ملف محلي:')) return;
  localFile = null;
  triedNoCors = false;
  video.crossOrigin = 'anonymous';
  video.src = u;
  video.load();
  video.play().catch(() => {});
}

urlInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') {
    updateSource();
    urlInput.blur();
  }
});

video.addEventListener('error', () => {
  const s = video.getAttribute('src');
  if (!s) return;
  if (video.crossOrigin && !triedNoCors && !s.startsWith('blob:')) {
    triedNoCors = true;
    video.removeAttribute('crossorigin');
    video.src = s;
    video.load();
    video.play().catch(() => {});
    return;
  }
  box.classList.remove('has-video');
  showNotification('تعذّر تشغيل الفيديو. تحقق من الرابط أو الملف.');
});

video.addEventListener('loadeddata', () => box.classList.add('has-video'));
video.addEventListener('emptied', () => box.classList.remove('has-video'));
video.addEventListener('play', () => ico($('playBtnSmall'), 'pause'));
video.addEventListener('pause', () => ico($('playBtnSmall'), 'play'));

/* شريط التقدم */
const seekRatio = e => {
  const r = seekWrapper.firstElementChild.getBoundingClientRect();
  return clamp((e.clientX - r.left) / r.width, 0, 1);
};
function setSeekUI(p) {
  progFill.style.width = (p * 100) + '%';
  if (video.duration) $('currentTime').textContent = formatTime(p * video.duration);
}
seekWrapper.addEventListener('pointerdown', e => {
  if (!video.duration) return;
  dragging = true;
  dragPos = seekRatio(e);
  seekWrapper.setPointerCapture(e.pointerId);
  setSeekUI(dragPos);
});
seekWrapper.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragPos = seekRatio(e);
  setSeekUI(dragPos);
});
const endDrag = commit => {
  if (!dragging) return;
  dragging = false;
  if (commit && video.duration) video.currentTime = dragPos * video.duration;
};
seekWrapper.addEventListener('pointerup', () => endDrag(true));
seekWrapper.addEventListener('pointercancel', () => endDrag(false));

video.addEventListener('timeupdate', () => {
  const d = video.duration;
  if (!d || !isFinite(d)) return;
  if (!dragging) {
    progFill.style.width = (video.currentTime / d * 100) + '%';
    $('currentTime').textContent = formatTime(video.currentTime);
  }
  $('durationTime').textContent = formatTime(d);
});

/* تحديد مقطع A-B */
let abA = null, abB = null, abRaf = 0, abSrc = '', clipBusy = false;
const abSeg = $('abSeg');

function abRender() {
  const d = video.duration;
  $('abAt').textContent = abA == null ? '--:--' : formatTime(abA);
  $('abBt').textContent = abB == null ? '--:--' : formatTime(abB);
  if (abA == null || !d || !isFinite(d)) {
    abSeg.style.display = 'none';
    return;
  }
  abSeg.style.display = 'block';
  abSeg.style.left = (abA / d * 100) + '%';
  abSeg.style.width = (((abB == null ? abA : abB) - abA) / d * 100) + '%';
}

function abTick() {
  abRaf = 0;
  if (abB == null) return;
  if (!clipBusy && !video.paused && !video.seeking && video.currentTime >= abB - .06) {
    video.currentTime = abA;
  }
  abRaf = requestAnimationFrame(abTick);
}

function abSet(w) {
  const t = video.currentTime;
  if (!video.duration) {
    showNotification('شغّل الفيديو أولاً');
    return;
  }
  $('abBar').classList.add('open');
  if (w === 'a') {
    abA = t;
    abSrc = video.currentSrc;
    if (abB != null && abB <= abA + .3) abB = null;
    showNotification('بداية المقطع: ' + formatTime(t));
  } else {
    if (abA == null) {
      showNotification('حدد نقطة البداية أولاً');
      return;
    }
    if (t <= abA + .3) {
      showNotification('نقطة النهاية يجب أن تكون بعد البداية');
      return;
    }
    abB = t;
    video.currentTime = abA;
    video.play().catch(() => {});
    showNotification('تم تحديد المقطع');
  }
  abRender();
  if (abB != null && !abRaf) abRaf = requestAnimationFrame(abTick);
}

function abClear() {
  abA = abB = null;
  abRender();
  showNotification('تم مسح التحديد');
}

function abToggle() {
  $('abBar').classList.toggle('open');
}

video.addEventListener('loadstart', () => {
  if (video.currentSrc !== abSrc) {
    abA = abB = null;
    abRender();
  }
});
video.addEventListener('durationchange', abRender);

/* توهج و Canvas أثناء القص */
const cutStage = $('cutStage');
const cutGlow1 = $('cutGlowLayer1');
const cutGlow2 = $('cutGlowLayer2');
const cutCaption = $('cutGlowCaption');
const cutPreviewCanvas = $('cutPreviewCanvas');
let cutGlowActive = false;
let cutGlowRaf = 0;

function startCutGlow() {
  if (cutGlowActive) return () => {};
  cutGlowActive = true;
  cutStage.classList.add('active');

  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  cutPreviewCanvas.width = Math.min(vw, 640);
  cutPreviewCanvas.height = Math.max(1, Math.round(cutPreviewCanvas.width * (vh / vw)));
  const ctx = cutPreviewCanvas.getContext('2d');

  const sampleCanvas = document.createElement('canvas');
  sampleCanvas.width = 64;
  sampleCanvas.height = 36;
  const sctx = sampleCanvas.getContext('2d');

  const wasPaused = video.paused;
  const wasMuted = video.muted;
  video.muted = true;
  if (abA != null) video.currentTime = abA;
  video.play().catch(() => {});

  let lastGlowTime = 0;
  const tick = now => {
    if (!cutGlowActive) return;
    if (abB != null && video.currentTime >= abB) {
      video.currentTime = abA || 0;
    }
    try {
      ctx.drawImage(video, 0, 0, cutPreviewCanvas.width, cutPreviewCanvas.height);
    } catch (e) {}

    if (now - lastGlowTime >= 120) {
      lastGlowTime = now;
      try {
        sctx.drawImage(video, 0, 0, sampleCanvas.width, sampleCanvas.height);
        const p1 = sctx.getImageData(16, 10, 1, 1).data;
        const p2 = sctx.getImageData(48, 10, 1, 1).data;
        const p3 = sctx.getImageData(32, 26, 1, 1).data;
        const r = Math.round((p1[0] + p2[0] + p3[0]) / 3);
        const g = Math.round((p1[1] + p2[1] + p3[1]) / 3);
        const b = Math.round((p1[2] + p2[2] + p3[2]) / 3);
        cutGlow1.style.setProperty('--gc1', `rgba(${r},${g},${b},.68)`);
        cutGlow2.style.setProperty('--gc2', `rgba(${p2[0]},${p2[1]},${p2[2]},.58)`);
      } catch (e) {}
    }
    cutGlowRaf = requestAnimationFrame(tick);
  };
  cutGlowRaf = requestAnimationFrame(tick);

  return () => {
    cutGlowActive = false;
    cancelAnimationFrame(cutGlowRaf);
    cutStage.classList.remove('active');
    video.muted = wasMuted;
    if (wasPaused) video.pause();
  };
}

/* قص المقطع المباشر بدون إعادة ترميز (MP4) */
const mp4Cut = (() => {
  const u32 = (d, o) => ((d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3]) >>> 0;
  const s32 = (d, o) => (d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3];
  const tg = (d, o) => String.fromCharCode(d[o], d[o + 1], d[o + 2], d[o + 3]);
  const put = (o, q, v) => { o[q] = v >>> 24; o[q + 1] = (v >>> 16) & 255; o[q + 2] = (v >>> 8) & 255; o[q + 3] = v & 255; };
  const words = (h, t = []) => {
    const o = new Uint8Array((h.length + t.length) * 4);
    let q = 0;
    for (const v of h) { put(o, q, v); q += 4; }
    for (const v of t) { put(o, q, v); q += 4; }
    return o;
  };
  const mk = (t, ...ps) => {
    let L = 8;
    for (const p of ps) L += p.length;
    const o = new Uint8Array(L);
    put(o, 0, L);
    for (let i = 0; i < 4; i++) o[4 + i] = t.charCodeAt(i);
    let q = 8;
    for (const p of ps) { o.set(p, q); q += p.length; }
    return o;
  };
  const kids = (d, x) => {
    const r = [];
    let s = x.b;
    while (s + 8 <= x.e) {
      let z = u32(d, s), h = 8;
      if (z === 1) { z = u32(d, s + 8) * 4294967296 + u32(d, s + 12); h = 16; }
      else if (z === 0) z = x.e - s;
      if (z < h || s + z > x.e) break;
      r.push({ t: tg(d, s + 4), s, e: s + z, b: s + h });
      s += z;
    }
    return r;
  };
  const kid = (d, x, t) => kids(d, x).find(k => k.t === t);
  const raw = (d, x) => d.slice(x.s, x.e);
  const fileRd = f => ({ size: f.size, read: async (a, b) => new Uint8Array(await f.slice(a, b).arrayBuffer()) });
  async function urlRd(u) {
    let size = Infinity;
    const r = await fetch(u, { headers: { Range: 'bytes=0-0' } });
    if (r.status !== 206) throw Error('norange');
    const m = /\/(\d+)\s*$/.exec(r.headers.get('Content-Range') || '');
    if (m) size = +m[1];
    return {
      size,
      read: async (a, b) => {
        const x = await fetch(u, { headers: { Range: `bytes=${a}-${b - 1}` } });
        if (x.status !== 206) throw Error('norange');
        return new Uint8Array(await x.arrayBuffer());
      }
    };
  }
  async function top(rd) {
    let pos = 0, moov = null, ftyp = null;
    while (pos < rd.size && !(moov && ftyp)) {
      const h = await rd.read(pos, Math.min(pos + 16, rd.size));
      if (h.length < 8) break;
      let sz = u32(h, 0), t = tg(h, 4), hd = 8;
      if (sz === 1) { sz = u32(h, 8) * 4294967296 + u32(h, 12); hd = 16; }
      else if (sz === 0) sz = rd.size - pos;
      if (sz < hd) throw Error('nomoov');
      if (t === 'moof') throw Error('frag');
      if (t === 'ftyp') ftyp = await rd.read(pos, pos + sz);
      if (t === 'moov') moov = await rd.read(pos, pos + sz);
      pos += sz;
    }
    if (!moov || !ftyp) throw Error('nomoov');
    return { ftyp, moov };
  }
  function trak(d, tk) {
    const mdia = kid(d, tk, 'mdia'), hd = kid(d, mdia, 'hdlr'), mdhd = kid(d, mdia, 'mdhd'), minf = kid(d, mdia, 'minf'), stbl = kid(d, minf, 'stbl'), g = t => kid(d, stbl, t), v = d[mdhd.b];
    const t = { tk, hd, mdhd, minf, stbl, type: tg(d, hd.b + 8), ts: u32(d, mdhd.b + (v ? 20 : 12)), ver: v, dts: [], dur: [] };
    let x = g('stts'), n = u32(d, x.b + 4), p = x.b + 8, T = 0;
    for (let i = 0; i < n; i++, p += 8) {
      const c = u32(d, p), l = u32(d, p + 4);
      for (let k = 0; k < c; k++) { t.dts.push(T); t.dur.push(l); T += l; }
    }
    const N = t.dts.length;
    x = g('stsz');
    const ss = u32(d, x.b + 4);
    t.sz = new Array(N);
    for (let i = 0; i < N; i++) t.sz[i] = ss || u32(d, x.b + 12 + i * 4);
    const co = [];
    x = g('stco');
    if (x) { const c = u32(d, x.b + 4); for (let i = 0; i < c; i++) co.push(u32(d, x.b + 8 + i * 4)); }
    else { x = g('co64'); const c = u32(d, x.b + 4); for (let i = 0; i < c; i++) co.push(u32(d, x.b + 8 + i * 8) * 4294967296 + u32(d, x.b + 12 + i * 8)); }
    x = g('stsc');
    const sc = [], cn = u32(d, x.b + 4);
    for (let i = 0; i < cn; i++) sc.push([u32(d, x.b + 8 + i * 12), u32(d, x.b + 12 + i * 12)]);
    t.off = new Array(N);
    let si = 0, ei = 0;
    for (let c = 0; c < co.length && si < N; c++) {
      while (ei + 1 < sc.length && sc[ei + 1][0] <= c + 1) ei++;
      let o = co[c];
      for (let k = 0; k < sc[ei][1] && si < N; k++) { t.off[si] = o; o += t.sz[si++]; }
    }
    t.cto = new Array(N).fill(0);
    x = g('ctts');
    t.cv = 0;
    t.hasCtts = !!x;
    if (x) {
      t.cv = d[x.b];
      const c = u32(d, x.b + 4);
      let q = 0, pp = x.b + 8;
      for (let i = 0; i < c; i++, pp += 8) {
        const k = u32(d, pp), o = s32(d, pp + 4);
        for (let j = 0; j < k && q < N; j++) t.cto[q++] = o;
      }
    }
    t.sync = null;
    x = g('stss');
    if (x) {
      t.sync = new Set();
      const c = u32(d, x.b + 4);
      for (let i = 0; i < c; i++) t.sync.add(u32(d, x.b + 8 + i * 4) - 1);
    }
    return t;
  }
  function pick(t, A, B, near) {
    const a = A * t.ts, b = B * t.ts, N = t.dts.length;
    let s = 0;
    for (let i = 0; i < N && t.dts[i] <= a; i++) if (!t.sync || t.sync.has(i)) s = i;
    if (near) {
      let n = -1;
      for (let i = s + 1; i < N; i++) if (t.dts[i] > a && (!t.sync || t.sync.has(i))) { n = i; break; }
      if (n > 0 && t.dts[n] < b && t.dts[n] - a < a - t.dts[s]) s = n;
    }
    let e = N;
    for (let i = s; i < N; i++) if (t.dts[i] >= b) { e = i; break; }
    let mp = 1e18;
    for (let i = s; i < Math.min(e, s + 32); i++) mp = Math.min(mp, t.dts[i] - t.dts[s] + t.cto[i]);
    return { s, e, mt: near ? (mp < 1e18 ? mp : 0) : Math.max(Math.round(a - t.dts[s]), 0) };
  }
  const rle = a => {
    const r = [];
    for (const v of a) {
      const l = r[r.length - 1];
      if (l && l[1] === v) l[0]++;
      else r.push([1, v]);
    }
    return r;
  };
  function build(d, t, sel, A, B, mts, off) {
    const { s, e, mt } = sel, n = e - s;
    const st = rle(t.dur.slice(s, e)), parts = [raw(d, kid(d, t.stbl, 'stsd')), mk('stts', words([0, st.length], st.flat()))];
    if (t.hasCtts) { const r = rle(t.cto.slice(s, e)); parts.push(mk('ctts', words([t.cv * 16777216, r.length], r.flat()))); }
    if (t.sync) { const ix = []; for (let i = s; i < e; i++) if (t.sync.has(i)) ix.push(i - s + 1); parts.push(mk('stss', words([0, ix.length], ix))); }
    parts.push(mk('stsc', words([0, 1, 1, n, 1])), mk('stsz', words([0, 0, n], t.sz.slice(s, e))), mk('stco', words([0, 1, off])));
    const minf = mk('minf', ...kids(d, t.minf).filter(k => k.t !== 'stbl').map(k => raw(d, k)), mk('stbl', ...parts));
    let md = 0;
    for (let i = s; i < e; i++) md += t.dur[i];
    const mh = raw(d, t.mdhd);
    if (t.ver) { put(mh, 32, 0); put(mh, 36, md); } else put(mh, 24, md);
    const tkx = kid(d, t.tk, 'tkhd'), tkh = raw(d, tkx), sd = Math.round((B - A) * mts);
    if (d[tkx.b]) put(tkh, 40, sd); else put(tkh, 28, sd);
    return mk('trak', tkh, mk('edts', mk('elst', words([0, 1, sd, mt, 65536]))), mk('mdia', mh, raw(d, t.hd), minf));
  }
  return async function (src, A, B, prog) {
    prog('قراءة بنية الملف…', 5);
    const rd = src instanceof Blob ? fileRd(src) : await urlRd(src);
    const { ftyp, moov } = await top(rd);
    const root = kids(moov, { b: 0, e: moov.length })[0];
    if (kid(moov, root, 'mvex')) throw Error('frag');
    const mvx = kid(moov, root, 'mvhd'), mts = u32(moov, mvx.b + (moov[mvx.b] ? 20 : 12));
    const trs = kids(moov, root).filter(k => k.t === 'trak').map(k => trak(moov, k)).filter(t => t.type === 'vide' || t.type === 'soun');
    if (!trs.length) throw Error('nomoov');
    const vi = trs.findIndex(t => t.type === 'vide'), sv = vi >= 0 ? pick(trs[vi], A, B, true) : null;
    const A2 = sv ? trs[vi].dts[sv.s] / trs[vi].ts : A;

    if (hi - lo > 9e8) throw Error('big');
    prog('تحميل المقطع…', 25);
    const buf = await rd.read(lo, hi);
    prog('بناء الملف…', 85);
    const datas = trs.map((t, i) => {
      let L = 0;
      for (let k = sels[i].s; k < sels[i].e; k++) L += t.sz[k];
      const o = new Uint8Array(L);
      let q = 0;
      for (let k = sels[i].s; k < sels[i].e; k++) {

    if (moov[mvx.b]) { put(mv, 32, 0); put(mv, 36, sd); } else put(mv, 24, sd);
    const mkMoov = offs => mk('moov', mv, ...trs.map((t, i) => build(moov, t, sels[i], A2, B, mts, offs[i])));

    const offs = datas.map(x => { const o = acc; acc += x.length; return o; });

    m = mkMoov(offs);
    const mh = new Uint8Array(8);
    put(mh, 0, total + 8);
    mh.set([109, 100, 97, 116], 4);
    return new Blob([ftyp, m, mh, ...datas], { type: 'video/mp4' });
  };
})();

const mp4CutMulti = (() => {
  const u32 = (d, o) => ((d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3]) >>> 0;
  const s32 = (d, o) => (d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3];

  const put = (o, q, v) => { o[q] = v >>> 24; o[q + 1] = (v >>> 16) & 255; o[q + 2] = (v >>> 8) & 255; o[q + 3] = v & 255; };

    const o = new Uint8Array((h.length + t.length) * 4);

    for (const v of t) { put(o, q, v); q += 4; }

    let L = 8;
    for (const p of ps) L += p.length;
    const o = new Uint8Array(L);
    put(o, 0, L);
    for (let i = 0; i < 4; i++) o[4 + i] = t.charCodeAt(i);
    let q = 8;
    for (const p of ps) { o.set(p, q); q += p.length; }
    return o;
  };
  const kids = (d, x) => {
    const r = [];
    let s = x.b;
    while (s + 8 <= x.e) {
      let z = u32(d, s), h = 8;
      if (z === 1) { z = u32(d, s + 8) * 4294967296 + u32(d, s + 12); h = 16; }

      if (z < h || s + z > x.e) break;
      r.push({ t: tg(d, s + 4), s, e: s + z, b: s + h });
      s += z;
    }
    return r;
  };
  const kid = (d, x, t) => kids(d, x).find(k => k.t === t);
  const raw = (d, x) => d.slice(x.s, x.e);
  const fileRd = f => ({ size: f.size, read: async (a, b) => new Uint8Array(await f.slice(a, b).arrayBuffer()) });
  async function urlRd(u) {
    let size = Infinity;
    const r = await fetch(u, { headers: { Range: 'bytes=0-0' } });
    if (r.status !== 206) throw Error('norange');
    const m = /\/(\d+)\s*$/.exec(r.headers.get('Content-Range') || '');
    if (m) size = +m[1];
    return {
      size,
      read: async (a, b) => {
        const x = await fetch(u, { headers: { Range: `bytes=${a}-${b - 1}` } });
        if (x.status !== 206) throw Error('norange');
        return new Uint8Array(await x.arrayBuffer());

  }
  async function top(rd) {
    let pos = 0, moov = null, ftyp = null;
    while (pos < rd.size && !(moov && ftyp)) {
      const h = await rd.read(pos, Math.min(pos + 16, rd.size));
      if (h.length < 8) break;

      if (sz === 1) { sz = u32(h, 8) * 4294967296 + u32(h, 12); hd = 16; }
      else if (sz === 0) sz = rd.size - pos;

    return { ftyp, moov };
  }
  function trak(d, tk) {
    const mdia = kid(d, tk, 'mdia'), hd = kid(d, mdia, 'hdlr'), mdhd = kid(d, mdia, 'mdhd'), minf = kid(d, mdia, 'minf'), stbl = kid(d, minf, 'stbl'), g = t => kid(d, stbl, t), v = d[mdhd.b];
    const t = { tk, hd, mdhd, minf, stbl, type: tg(d, hd.b + 8), ts: u32(d, mdhd.b + (v ? 20 : 12)), ver: v, dts: [], dur: [] };
    let x = g('stts'), n = u32(d, x.b + 4), p = x.b + 8, T = 0;
    for (let i = 0; i < n; i++, p += 8) {
      const c = u32(d, p), l = u32(d, p + 4);

    }
    const N = t.dts.length;
    x = g('stsz');
    const ss = u32(d, x.b + 4);
    t.sz = new Array(N);
    for (let i = 0; i < N; i++) t.sz[i] = ss || u32(d, x.b + 12 + i * 4);
    const co = [];
    x = g('stco');
    if (x) { const c = u32(d, x.b + 4); for (let i = 0; i < c; i++) co.push(u32(d, x.b + 8 + i * 4)); }
    else { x = g('co64'); const c = u32(d, x.b + 4); for (let i = 0; i < c; i++) co.push(u32(d, x.b + 8 + i * 8) * 4294967296 + u32(d, x.b + 12 + i * 8)); }
    x = g('stsc');
    const sc = [], cn = u32(d, x.b + 4);
    for (let i = 0; i < cn; i++) sc.push([u32(d, x.b + 8 + i * 12), u32(d, x.b + 12 + i * 12)]);
    t.off = new Array(N);
    let si = 0, ei = 0;
    for (let c = 0; c < co.length && si < N; c++) {
      while (ei + 1 < sc.length && sc[ei + 1][0] <= c + 1) ei++;
      let o = co[c];
      for (let k = 0; k < sc[ei][1] && si < N; k++) { t.off[si] = o; o += t.sz[si++]; }
    }
    t.cto = new Array(N).fill(0);
    x = g('ctts');
    t.cv = 0;
    t.hasCtts = !!x;
    if (x) {
      t.cv = d[x.b];
      const c = u32(d, x.b + 4);
      let q = 0, pp = x.b + 8;
      for (let i = 0; i < c; i++, pp += 8) {
        const k = u32(d, pp), o = s32(d, pp + 4);
        for (let j = 0; j < k && q < N; j++) t.cto[q++] = o;
      }
    }
    t.sync = null;
    x = g('stss');
    if (x) {
      t.sync = new Set();

  }
  function pick(t, A, B, near) {
    const a = A * t.ts, b = B * t.ts, N = t.dts.length;
    let s = 0;
    for (let i = 0; i < N && t.dts[i] <= a; i++) if (!t.sync || t.sync.has(i)) s = i;
    if (near) {
      let n = -1;
      for (let i = s + 1; i < N; i++) if (t.dts[i] > a && (!t.sync || t.sync.has(i))) { n = i; break; }
      if (n > 0 && t.dts[n] < b && t.dts[n] - a < a - t.dts[s]) s = n;
    }
    let e = N;
    for (let i = s; i < N; i++) if (t.dts[i] >= b) { e = i; break; }
    let mp = 1e18;
    for (let i = s; i < Math.min(e, s + 32); i++) mp = Math.min(mp, t.dts[i] - t.dts[s] + t.cto[i]);
    return { s, e, mt: near ? (mp < 1e18 ? mp : 0) : Math.max(Math.round(a - t.dts[s]), 0) };
  }
  const rle = a => {
    const r = [];
    for (const v of a) {
      const l = r[r.length - 1];
      if (l && l[1] === v) l[0]++;
      else r.push([1, v]);
    }
    return r;
  };
  function buildMulti(d, t, segSels, mts, off) {
    const durArr = [], ctoArr = [], szArr = [], syncArr = [], elstArr = [];
    let idxCounter = 0;
    for (const sel of segSels) {
      const { s, e, mt, A, B } = sel;
      for (let i = s; i < e; i++) {
        durArr.push(t.dur[i]);
        if (t.hasCtts) ctoArr.push(t.cto[i]);
        szArr.push(t.sz[i]);
        if (t.sync && t.sync.has(i)) syncArr.push(idxCounter + 1);
        idxCounter++;
      }
      const sd = Math.max(1, Math.round((B - A) * mts));
      elstArr.push(sd, mt, 65536);
    }
    const n = szArr.length;
    const st = rle(durArr);
    const parts = [raw(d, kid(d, t.stbl, 'stsd')), mk('stts', words([0, st.length], st.flat()))];
    if (t.hasCtts) {
      const r = rle(ctoArr);
      parts.push(mk('ctts', words([t.cv * 16777216, r.length], r.flat())));
    }
    if (t.sync) parts.push(mk('stss', words([0, syncArr.length], syncArr)));
    parts.push(mk('stsc', words([0, 1, 1, n, 1])), mk('stsz', words([0, 0, n], szArr)), mk('stco', words([0, 1, off])));
    const minf = mk('minf', ...kids(d, t.minf).filter(k => k.t !== 'stbl').map(k => raw(d, k)), mk('stbl', ...parts));
    let md = 0;
    for (const v of durArr) md += v;
    const mh = raw(d, t.mdhd);
    if (t.ver) { put(mh, 32, 0); put(mh, 36, md); } else put(mh, 24, md);
    let totalSd = 0;
    for (let i = 0; i < elstArr.length; i += 3) totalSd += elstArr[i];
    const tkx = kid(d, t.tk, 'tkhd'), tkh = raw(d, tkx);
    if (d[tkx.b]) put(tkh, 40, totalSd); else put(tkh, 28, totalSd);
    return {
      trak: mk('trak', tkh, mk('edts', mk('elst', words([0, segSels.length], elstArr))), mk('mdia', mh, raw(d, t.hd), minf)),
      totalSd
    };
  }
  return async function (src, ranges, prog) {
    prog('قراءة بنية الملف…', 5);
    const rd = src instanceof Blob ? fileRd(src) : await urlRd(src);
    const { ftyp, moov } = await top(rd);
    const root = kids(moov, { b: 0, e: moov.length })[0];
    if (kid(moov, root, 'mvex')) throw Error('frag');
    const mvx = kid(moov, root, 'mvhd'), mts = u32(moov, mvx.b + (moov[mvx.b] ? 20 : 12));
    const trs = kids(moov, root).filter(k => k.t === 'trak').map(k => trak(moov, k)).filter(t => t.type === 'vide' || t.type === 'soun');
    if (!trs.length) throw Error('nomoov');
    const vi = trs.findIndex(t => t.type === 'vide');
    const perTrackSegs = trs.map(() => []);
    for (const [A, B] of ranges) {
      const sv = vi >= 0 ? pick(trs[vi], A, B, true) : null;
      const A2 = sv ? trs[vi].dts[sv.s] / trs[vi].ts : A;
      if (B <= A2 + 0.1) continue;
      trs.forEach((t, i) => {
        const sel = i === vi ? sv : pick(t, A2, B);
        if (sel.e > sel.s) perTrackSegs[i].push({ ...sel, A: A2, B });
      });
    }
    if (perTrackSegs.some(list => !list.length)) throw Error('empty');
    let totalBytes = 0;
    trs.forEach((t, i) => {
      for (const sel of perTrackSegs[i]) {
        for (let k = sel.s; k < sel.e; k++) totalBytes += t.sz[k];
      }
    });
    if (totalBytes > 9e8) throw Error('big');
    const datas = [];
    for (let i = 0; i < trs.length; i++) {
      const t = trs[i];
      let L = 0;
      for (const sel of perTrackSegs[i]) for (let k = sel.s; k < sel.e; k++) L += t.sz[k];
      const o = new Uint8Array(L);
      let q = 0;
      for (let j = 0; j < perTrackSegs[i].length; j++) {
        const sel = perTrackSegs[i][j];
        const lo = t.off[sel.s];
        const hi = t.off[sel.e - 1] + t.sz[sel.e - 1];
        const pct = 15 + Math.round(((i * perTrackSegs[i].length + j + 1) / (trs.length * perTrackSegs[i].length)) * 65);
        prog(`تحميل اللقطة ${j + 1} من ${perTrackSegs[i].length}…`, pct);
        const buf = await rd.read(lo, hi);
        for (let k = sel.s; k < sel.e; k++) {
          o.set(buf.subarray(t.off[k] - lo, t.off[k] - lo + t.sz[k]), q);

    }
    prog('دمج اللقطات العشوائية…', 88);

    const mv = raw(moov, mvx);
    const mkMoov = offs => {
      const built = trs.map((t, i) => buildMulti(moov, t, perTrackSegs[i], mts, offs[i]));
      const sd = Math.max(...built.map(b => b.totalSd));
      if (moov[mvx.b]) { put(mv, 32, 0); put(mv, 36, sd); } else put(mv, 24, sd);

    m = mkMoov(offs);
    const mh = new Uint8Array(8);
    put(mh, 0, total + 8);
    mh.set([109, 100, 97, 116], 4);
    return new Blob([ftyp, m, mh, ...datas], { type: 'video/mp4' });

})();

let clipFile = null;
let randomFiles = [];
const cbar = $('clipBar'), cmsg = $('clipMsg'), cSave = $('clipSave'), rList = $('randomList');
const CLIP_ERR = {
  frag: 'هذا الملف مجزّأ وغير مدعوم للقص',
  nomoov: 'تعذّر قراءة الملف — القص يدعم MP4 و MOV فقط',
  norange: 'المصدر لا يدعم التحميل الجزئي أو يمنع الوصول — جرّب ملفاً محلياً',
  big: 'المقطع كبير جداً للقص على هذا الجهاز',
  empty: 'المقطع المحدد فارغ'
};

function clipUI(done, txt, isRandom = false) {
  cbar.classList.add('open');
  $('abBar').classList.remove('open');
  cmsg.textContent = txt;
  rList.classList.toggle('hidden', !isRandom);
  cSave.classList.toggle('hidden', isRandom || !done);
}

function clipClose() {
  cbar.classList.remove('open');
  rList.classList.add('hidden');
  rList.innerHTML = '';
  randomFiles = [];
  clipBusy = false;
}

function pickRandomRanges(dur, count = 5, totalSec = 60) {
  const actualTotal = Math.min(totalSec, dur * 0.9);
  const segLen = actualTotal / count;
  const maxStart = Math.max(0, dur - segLen);
  const starts = [];
  for (let i = 0; i < count; i++) {
    let best = Math.random() * maxStart;
    for (let tries = 0; tries < 20; tries++) {
      const cand = Math.random() * maxStart;
      if (starts.every(s => Math.abs(cand - s) >= segLen * 0.85)) {
        best = cand;
        break;
      }
    }
    starts.push(best);
  }
  starts.sort((a, b) => a - b);
  return starts.map(s => [s, Math.min(dur, s + segLen)]);
}

function downloadFileObj(f) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f);
  a.download = f.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function shareFileObj(f) {
  if (!f) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title: f.name });
    } else {
      downloadFileObj(f);
    }
  } catch (e) {
    if (e.name !== 'AbortError') downloadFileObj(f);
  }
}

function renderRandomList() {
  const canShare = !!(navigator.canShare && randomFiles[0] && navigator.canShare({ files: [randomFiles[0].file] }));
  rList.innerHTML = randomFiles.map((item, idx) => `
    <div class="rand-item">
      <div class="rand-info">
        <b>لقطة ${idx + 1} (${Math.round(item.end - item.start)}ث)</b>
        <span>${formatTime(item.start)} → ${formatTime(item.end)}</span>
      </div>
      <div class="rand-acts">
        <button class="r-dl" onclick="downloadRandomItem(${idx})">تنزيل</button>
        ${canShare ? `<button class="r-sh" onclick="shareRandomItem(${idx})">حفظ بالألبوم</button>` : ''}
      </div>
    </div>
  `).join('');
}

function downloadRandomItem(idx) {
  const item = randomFiles[idx];
  if (item) downloadFileObj(item.file);
}

function shareRandomItem(idx) {
  const item = randomFiles[idx];
  if (item) shareFileObj(item.file);
}

async function clipRandomStart() {
  if (clipBusy) return;
  const dur = video.duration;
  if (!dur || !isFinite(dur)) {
    showNotification('شغّل الفيديو أولاً');
    return;
  }
  if (dur < 10) {
    showNotification('مدة الفيديو قصيرة جداً للقص العشوائي');
    return;
  }
  const src = localFile || (/^https?:/.test(video.currentSrc) ? video.currentSrc : null);
  if (!src) {
    showNotification('لا يوجد مصدر قابل للقص');
    return;
  }
  const ranges = pickRandomRanges(dur, 5, 60);
  clipBusy = true;
  clipFile = null;
  randomFiles = [];
  cutCaption.textContent = 'جارٍ تجهيز 5 لقطات عشوائية…';
  const stopGlow = startCutGlow();
  try {
    const stamp = Date.now();
    for (let i = 0; i < ranges.length; i++) {
      const [s, e] = ranges[i];
      const blob = await mp4Cut(src, s, e, (t, p) => {
        cutCaption.textContent = `لقطة ${i + 1}/5: ${t} ${p}%`;
      });
      const file = new File([blob], `random_${i + 1}_${stamp}.mp4`, { type: 'video/mp4' });
      randomFiles.push({ file, start: s, end: e });
    }
    renderRandomList();
    clipUI(true, 'تم قص 5 لقطات عشوائية — اختر للحفظ في الألبوم أو التنزيل:', true);
  } catch (e) {
    cbar.classList.remove('open');
    showNotification(CLIP_ERR[e.message] || 'تعذّر القص العشوائي');
  } finally {
    stopGlow();
    clipBusy = false;
  }
}

async function clipStart() {
  if (clipBusy) return;
  if (abA == null || abB == null) {
    showNotification('حدد البداية والنهاية أولاً');
    return;
  }
  const src = localFile || (/^https?:/.test(video.currentSrc) ? video.currentSrc : null);
  if (!src) {
    showNotification('لا يوجد مصدر قابل للقص');
    return;
  }
  clipBusy = true;
  clipFile = null;
  randomFiles = [];
  cutCaption.textContent = 'جارٍ القص…';
  const stopGlow = startCutGlow();
  try {
    const blob = await mp4Cut(src, abA, abB, (t, p) => {
      cutCaption.textContent = `${t} ${p}%`;
    });
    clipFile = new File([blob], 'clip_' + Date.now() + '.mp4', { type: 'video/mp4' });
    const canShare = navigator.canShare && navigator.canShare({ files: [clipFile] });
    $('clipSaveTxt').textContent = 'حفظ في الألبوم';
    clipDownload();
    clipUI(!!canShare, 'تم القص وحفظ المقطع', false);
  } catch (e) {
    cbar.classList.remove('open');
    showNotification(CLIP_ERR[e.message] || 'تعذّر القص');
  } finally {
    stopGlow();
    clipBusy = false;
  }
}

async function clipShare() {
  await shareFileObj(clipFile);
}

function clipDownload() {
  if (clipFile) downloadFileObj(clipFile);
}
</script>
